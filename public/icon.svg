<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4" />
  <circle cx="256" cy="256" r="176" fill="#1e40af" opacity="0.3" />

  <!-- Center Icon Group -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Graduation Cap Top (Diamond) -->
    <polygon points="256,128 396,192 256,256 116,192" fill="#ffffff" />
    <!-- Graduation Cap Brim Underlay -->
    <polygon points="256,256 384,198 384,212 256,270 128,212 128,198" fill="#e2e8f0" />

    <!-- Cap Skull Base -->
    <path d="M172 225 L172 280 C172 324 256 348 256 348 C256 348 340 324 340 280 L340 225" fill="#f8fafc" />

    <!-- Tassel -->
    <path d="M368 200 L394 250 L394 300" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="394" cy="305" r="7" fill="#d97706" />
  </g>

  <!-- Digital Checkmark & Book Ribbon Accent -->
  <g transform="translate(0, 30)">
    <!-- Open Book Pages Underneath -->
    <path d="M160 360 C208 346 256 358 256 358 C256 358 304 346 352 360 L352 388 C304 374 256 386 256 386 C256 386 208 374 160 388 Z" fill="#93c5fd" opacity="0.9" />
    <circle cx="256" cy="390" r="16" fill="url(#goldGrad)" />
    <!-- Checkmark inside Badge -->
    <path d="M250 390 L254 394 L263 385" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
